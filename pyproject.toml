[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silent-data-defects"
version = "0.1.0"
description = "Ranqueia defeitos de dados pelo quanto mudam a decisao, e emite o contrato que impede o defeito de voltar."
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pyarrow>=16"]

[project.optional-dependencies]
bench = ["numpy>=1.26"]

[project.scripts]
sdd = "sdd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
